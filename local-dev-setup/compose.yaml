
services:
  db:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_textsearch
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 15

  firebase-auth:
    image: node:22-bookworm-slim
    container_name: local-firebase-auth
    working_dir: /workspace
    volumes:
      - ./firebase:/workspace
    command: >
      sh -c "npx --yes firebase-tools emulators:start
      --only auth
      --project demo-local-app
      --config firebase.json"
    ports:
      - "127.0.0.1:9099:9099"
      - "127.0.0.1:4000:4000"
    init: true

volumes:
  postgres_data:
